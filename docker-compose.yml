services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # API/worker connect to ollama:11434 on the Compose network.
    # No Windows port binding: a native Ollama installation may use 11434.
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["pull"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b}
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      'until ollama list >/dev/null 2>&1; do
        echo "Waiting for Ollama...";
        sleep 2;
      done;
      ollama pull "$${OLLAMA_MODEL}"'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_EXTRAS: ""
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VOICEFLOW_API_TOKEN: ${VOICEFLOW_API_TOKEN:?Set VOICEFLOW_API_TOKEN and use --env-file .env.docker}
    volumes:
      - uploads_data:/app/uploads
      - obsidian_data:/app/obsidian_vault
      - reports_data:/app/reports
      - ./models:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_EXTRAS: ${UV_EXTRAS:-audio}
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - uploads_data:/app/uploads
      - obsidian_data:/app/obsidian_vault
      - reports_data:/app/reports
      - ./models:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: celery -A app.worker.app worker --loglevel=info --pool=solo --concurrency=1 --prefetch-multiplier=1


  # Телеграм-бот VoiceFlow AI. Запуск: docker compose --profile bot up -d bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_EXTRAS: ""
    restart: unless-stopped
    profiles: ["bot"]
    env_file:
      - .env.docker
    environment:
      VOICEFLOW_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
    command: ["python", "-m", "bot.main"]

volumes:
  redis_data:
  ollama_data:
  uploads_data:
  obsidian_data:
  reports_data:

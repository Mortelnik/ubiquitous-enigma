[project]
name = "voiceflow-ai"
version = "1.0.0"
description = "Локальный пайплайн транскрибации, саммаризации и экспорта встреч в Obsidian."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "celery>=5.3",
  "redis>=5.0",
  "ollama>=0.3",
  "joblib>=1.3",
  "aiogram>=3.4",
  "aiohttp>=3.9",
  "aiohttp-socks>=0.9",
  "pydantic>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.0",
  "tqdm>=4.66",
]
# CTranslate2 4.4 (locked for WhisperX) uses CUDA 12 + cuDNN 8.
cuda = [
  "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12==8.9.7.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
training = [
  "pandas>=2.0",
  "pyarrow>=14",
  "huggingface-hub>=0.24",
]
tts-windows = [
  "pywin32>=306; sys_platform == 'win32'",
]
whisperx = [
  "whisperx>=3.3",
  "silero-vad>=5.1",
  "soundfile>=0.12",
  "torch",
  "torchaudio",
]
diarization = [
  "torch",
  "torchvision",
  "torchaudio",
  "nemo_toolkit[asr]>=1.30",
  "librosa>=0.10",
  "soundfile>=0.12",
]
notebook = [
  "ipykernel>=6.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[dependency-groups]
dev = [
  "fakeredis[lua]>=2.30",
  "pytest>=8.0",
  "httpx>=0.27",
  "pandas>=2.0",
  "pyarrow>=14",
]

[tool.uv]
package = false
# Faster-Whisper 1.2.1 passes metadata_errors, removed in newer PyAV.
constraint-dependencies = [
  "av==16.0.1",
  # CTranslate2 4.4 uses pkg_resources to load its Windows DLLs.
  "setuptools<81; sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_DIARIZATION: "false"
      WHISPER_MODEL: "base"
      WHISPER_DEVICE: "cpu"
      DIARIZATION_DEVICE: "cpu"
      OLLAMA_HOST: "http://localhost:11434"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Check lock file
        run: uv lock --check

      - name: Install locked test dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Validate CPU and GPU Compose configurations
        env:
          VOICEFLOW_API_TOKEN: ci-configuration-only
        run: |
          cp .env.docker.example .env.docker
          docker compose --env-file .env.docker config --quiet
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.storage.yml config --quiet
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.storage.yml --profile bot config --quiet

  audio-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build CPU audio image and check native imports
        run: docker build --build-arg UV_EXTRAS=audio -t voiceflow-audio:ci .

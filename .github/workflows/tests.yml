name: tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ENABLE_DIARIZATION: "false"
      WHISPER_MODEL: "base"
      WHISPER_DEVICE: "cpu"
      DIARIZATION_DEVICE: "cpu"
      OLLAMA_HOST: "http://localhost:11434"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --locked

      - name: Run smoke tests
        run: uv run --locked pytest -q

  audio-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build CPU audio image and check native imports
        run: docker build --build-arg UV_EXTRAS=audio -t voiceflow-audio:ci .
